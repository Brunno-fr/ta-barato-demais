<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<th:block th:replace="~{fragments/seo :: metadata('Rankings editoriais — Tabarato Demais', 'Conheça nossas seleções de produtos, os critérios utilizados e as justificativas de cada indicação. Compare as ofertas cadastradas.', ${seo.image})}"></th:block><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/product.css"></head><body>
<header class="site-header"><div class="container header-row"><a class="brand" href="/"><img src="/images/brand.png" alt="Tabarato Demais" width="1774" height="887"></a><nav aria-label="Principal"><a href="/">Início</a><a href="/#destaques">Produtos</a></nav></div></header>
<main class="container product-page"><h1>Rankings editoriais</h1><p>Seleções organizadas pela equipe. Consulte os critérios e as justificativas de cada lista antes de escolher.</p><p th:if="${#lists.isEmpty(rankings)}">Ainda não há rankings publicados.</p>
<article class="product-description" th:each="r : ${rankings}"><h2><a th:href="@{/rankings/{slug}(slug=${r.slug})}" th:text="${r.title}"></a></h2><p th:text="${r.description}"></p></article>
<aside class="disclosure"><p>Podemos receber comissão por compras realizadas por links de afiliados. Preços e disponibilidade podem mudar.</p></aside></main></body></html>

<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Produtos — Tabarato Demais</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body>
<header class="admin-header"><a class="brand" href="/admin">TABARATO <strong>DEMAIS</strong></a><form th:action="@{/admin/logout}" method="post"><button class="secondary">Sair da conta</button></form></header>
<main class="dashboard"><a class="back-link" href="/admin">← Voltar ao painel</a><h1>Produtos e ofertas</h1><p class="muted">Cadastre um modelo e versão exatos. Depois, adicione os links de cada loja.</p><a class="button-link" href="/admin/produtos/novo">Novo produto</a>
<p class="notice" th:if="${#lists.isEmpty(products)}">Nenhum produto cadastrado. Comece pelo nome, foto e categoria.</p>
<div class="table-scroll" th:unless="${#lists.isEmpty(products)}"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="p : ${products}"><td th:text="${p.name}"></td><td th:text="${p.category.name}"></td><td th:text="${p.status.name() == 'DRAFT' ? 'Rascunho' : (p.status.name() == 'PUBLISHED' ? 'Publicado' : 'Arquivado')}"></td><td><a class="edit-link" th:href="@{/admin/produtos/{id}/editar(id=${p.id})}">Editar produto</a> · <a class="edit-link" th:href="@{/admin/produtos/{id}/ofertas(id=${p.id})}">Ofertas e links</a></td></tr></tbody></table></div>
</main></body></html>

site:
  base-url: ${SITE_BASE_URL:http://localhost:8080}
  indexing-enabled: ${SITE_INDEXING_ENABLED:false}
spring:
  application:
    name: tabaratodemais
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tabaratodemais}
    username: ${DB_USERNAME:tabaratodemais}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: false
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
